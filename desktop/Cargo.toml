[package]
name = "histcite-desktop"
version = "0.3.4"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "HistCite-style bibliometric analysis for macOS"
repository = "https://github.com/yangnim21029/histcite-mac"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
histcite-mac = { path = "..", version = "0.3.4" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

serde = { version = "1", features = ["derive"] }
base64 = "0.23"
urlencoding = "2"
tokio = { version = "1", features = ["sync", "rt"] }

[lints.rust]
unsafe_code = "forbid"
